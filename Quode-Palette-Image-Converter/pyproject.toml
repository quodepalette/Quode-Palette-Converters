[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quode-palette-image-converter"
version = "1.0.0"
description = "A dependable image converter powered by Pillow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4.0"]
license = { text = "MIT" }
authors = [{ name = "Quode Palette contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
quode-image = "quode_palette_image_converter.cli:main"

[tool.setuptools.packages.find]
include = ["quode_palette_image_converter*"]
