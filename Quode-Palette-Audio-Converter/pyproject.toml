[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quode-palette-audio-converter"
version = "1.0.0"
description = "A dependable command-line audio converter powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quode Palette contributors" }]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Sound/Audio :: Conversion"]

[project.scripts]
quode-audio = "quode_palette_audio_converter.cli:main"

[tool.setuptools.packages.find]
include = ["quode_palette_audio_converter*"]
