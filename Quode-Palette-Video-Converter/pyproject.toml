[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quode-palette-video-converter"
version = "1.0.0"
description = "A practical video converter powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
quode-video = "quode_palette_video_converter.cli:main"

[tool.setuptools.packages.find]
include = ["quode_palette_video_converter*"]
